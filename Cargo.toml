[package]
name = "didwhat"
version = "0.3.0"
edition = "2021"
description = "What did I do? Your commits across every git repo under a folder, grouped by day."
license = "MIT"
repository = "https://github.com/neosergio/didwhat"
readme = "README.md"
keywords = ["git", "cli", "worklog", "standup", "report"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
